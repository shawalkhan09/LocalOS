<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ironclad Fitness Login</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F0EA;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
input:focus{outline:3px solid #111;outline-offset:2px}
.ph{background:radial-gradient(120% 80% at 70% 10%,#3a3a36 0%,#1a1a18 55%,#0c0c0b 100%)}
@media (max-width:820px){.lg{grid-template-columns:minmax(0,1fr)!important}.side{display:none!important}}
</style>
</helmet>
<div class="lg" style="width:1440px;height:900px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding:20px">
<div style="background:#fff;border-radius:36px;display:flex;flex-direction:column;justify-content:space-between;padding:40px 56px;box-sizing:border-box">
<a href="#" style="display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.02em">
<span style="width:34px;height:34px;border-radius:10px;background:#111;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"></path></svg></span>Ironclad Fitness</a>
<div style="display:flex;flex-direction:column;gap:32px;max-width:420px;width:100%;align-self:center">
<div style="display:flex;flex-direction:column;gap:12px">
<h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.04em">Welcome back.</h1>
<p style="margin:0;font-size:16px;line-height:1.55;color:#5a5a54">Sign in to manage bookings, classes and your team.</p>
</div>
<form style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:8px"><label for="em" style="font-size:14px;font-weight:600">Email</label><input id="em" type="email" style="height:54px;border-radius:16px;border:1.5px solid #dcdad2;background:#faf9f6;padding:0 18px;font-size:16px"></div>
<div style="display:flex;flex-direction:column;gap:8px"><label for="pw" style="font-size:14px;font-weight:600">Password</label><input id="pw" type="password" style="height:54px;border-radius:16px;border:1.5px solid #dcdad2;background:#faf9f6;padding:0 18px;font-size:16px"></div>
<button type="submit" style="height:56px;border:0;border-radius:999px;background:#111;color:#fff;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:4px">Sign in</button>
</form>
</div>
<span style="font-size:13px;color:#6a6a63">Staff and owner access only.</span>
</div>
<div class="side ph" style="border-radius:36px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:40px;box-sizing:border-box">
<span style="color:rgba(255,255,255,.5);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase">[PHOTO: gym interior]</span>
<div style="position:absolute;left:40px;top:40px;background:{{accent}};border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700">Owner dashboard</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E63946","options":["#E63946","#D4F24A","#FF7A3D","#7CE0C3"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return { accent: this.props.accent ?? '#E63946' }; }
}
</script>
</body>
</html>
